  android: true
  adaptive_icon_background: "#35579A"
  adaptive_icon_foreground: "assets/images/branding/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/branding/app_icon.png"
    background_color: "#35579A"
    theme_color: "#35579A"
  windows:
    generate: true
    image_path: "assets/images/branding/app_icon.png"

flutter_native_splash:
  color: "#35579A"
  image: assets/images/splash/kapak_splash.png
  fullscreen: true
  android_12:
    color: "#35579A"
    image: assets/images/splash/kapak_splash.png
  web: false
